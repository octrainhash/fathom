# Builds the two downloads when you push a tag like v1.0.1, and attaches them to a GitHub release.
# These are plain zips (Fathom is Python + a web page), not signed installers: a code-signing certificate
# is a paid thing only you can hold, so none is faked here.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Quick checks
        run: |
          python -m compileall -q app launch.py
          node --version && for f in static/*.js; do node --check "$f"; done
      - name: Build zips
        run: python tools/build_zips.py dist
      - name: Checksums
        run: cd dist && sha256sum *.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fathom-downloads
          path: dist/*
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
